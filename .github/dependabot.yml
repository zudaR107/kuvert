version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      # v13 dropped prebuilt binaries entirely (always compiles from
      # source via node-gyp now, on every platform) - broke schlussel's
      # Docker build after the same bump there (zudaR107/schlussel#132).
      - dependency-name: "better-sqlite3"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
